name: Release

permissions:
  contents: write

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build app
        run: pnpm run build

      - name: Fetch latest pre-built sermon database
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path resources
          Invoke-WebRequest -Uri "https://github.com/codeDeSyntax/hisv_desktop/releases/latest/download/sermons.db" -OutFile "resources/sermons.db"

      - name: Verify sermon database asset exists
        shell: pwsh
        run: |
          if (!(Test-Path "resources/sermons.db")) {
            throw "resources/sermons.db is missing. Commit it or add a build-db step."
          }

      - name: Upload sermon database asset
        uses: softprops/action-gh-release@v2
        with:
          files: resources/sermons.db
          tag_name: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Package with electron-builder
        run: pnpm exec electron-builder --win --publish=always
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
