<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="script-src 'self' 'unsafe-inline';"
    />
    <title>Blessed music</title>
  </head>
  <body>
    <div id="root">
      <!-- Inline loading screen — visible until React mounts and replaces #root contents -->
      <div
        id="preload-screen"
        style="
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          height: 100vh;
          width: 100vw;
          background: #212121;
          font-family: &quot;Outfit&quot;, system-ui, sans-serif;
          user-select: none;
          overflow: hidden;
        "
      >
        <img
          src="/icon.png"
          alt=""
          width="72"
          height="72"
          style="
            border-radius: 50%;
            margin-bottom: 20px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.5);
          "
        />
        <div
          style="
            color: rgba(255, 255, 255, 0.88);
            font-size: 22px;
            font-weight: 600;
            letter-spacing: 0.04em;
            margin-bottom: 6px;
          "
        >
          His Voice
        </div>
        <div
          style="
            color: rgba(255, 255, 255, 0.3);
            font-size: 11px;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            margin-bottom: 36px;
          "
        >
          Sermon Archive &amp; Reader
        </div>
        <div style="display: flex; gap: 8px">
          <span class="_dot"></span><span class="_dot"></span
          ><span class="_dot"></span>
        </div>
        <style>
          ._dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: rgba(200, 140, 80, 0.7);
            animation: _b 1.2s ease-in-out infinite;
          }
          ._dot:nth-child(2) {
            animation-delay: 0.2s;
          }
          ._dot:nth-child(3) {
            animation-delay: 0.4s;
          }
          @keyframes _b {
            0%,
            80%,
            100% {
              transform: scale(0.7);
              opacity: 0.4;
            }
            40% {
              transform: scale(1);
              opacity: 1;
            }
          }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
